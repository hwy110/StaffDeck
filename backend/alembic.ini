# Alembic 数据库迁移配置 — StaffDeck 企业级部署
# 此文件用于 PostgreSQL 等生产数据库的 Schema 版本管理。
# SQLite 开发环境仍使用内联迁移（database.py 中的 _migrate_sqlite_skill_schema）。

[alembic]
# 迁移脚本目录（相对于此文件）
script_location = alembic

# 数据库连接 URL — 运行时由 env.py 从环境变量/DATABASE_URL 覆盖
# sqlalchemy.url = postgresql://user:pass@localhost:5432/staffdeck

# 迁移文件命名模板
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# 时区（用于迁移文件时间戳）
timezone = UTC

# 版本号路径分隔符
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
